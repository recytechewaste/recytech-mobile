name: recytecmobproj
description: "RecyTech Mobile Application – E-waste Management System"
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # REST API communication with Node.js (Express)
  dio: ^5.7.0

  # Secure local storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Responsive UI (based on Figma design size)
  flutter_screenutil: ^5.9.3

  # Image capture and selection (collector evidence/profile images)
  image_picker: ^1.1.2

  # QR scanning for designated-bin household drop-off check-ins
  mobile_scanner: ^7.0.1

  # Open external navigation apps (Google Maps)
  url_launcher: ^6.3.0

  # Foreground device location for nearby Household bin sorting
  geolocator: ^13.0.4

  # Local Collector-only YOLO/TFLite inference
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint rules
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/recytech_yolov8.tflite
    - assets/models/labels.txt
